[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-summarise"
version = "0.1.0"
description = "Inspect, summarize, and generate dark-themed PDF & Markdown docs for Git repositories using multi-provider AI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Armaan245"},
]

dependencies = [
    "GitPython>=3.1.0",
    "google-genai>=1.0.0",
    "rich>=13.0.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
    "xhtml2pdf>=0.2.11"
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0"
]

[project.scripts]
git-summarise = "git_summarise:main"