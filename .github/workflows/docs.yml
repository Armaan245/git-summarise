name: Generate Documentation & PDF Reports

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full Git history needed for commit diffs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate Docs Suite & PDFs
        run: |
          git-summarise --docs --pdf

      - name: Commit and Push Generated Docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate /docs Markdown & PDF manuals [skip ci]"
          file_pattern: "docs/*"